name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  backend:
    name: Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/invite-user/index.ts supabase/functions/ai-report/index.ts supabase/functions/delete-account/index.ts
      - name: Start minimal local stack
        run: >-
          supabase start --exclude
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local
      - run: supabase test db --local
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  security:
    name: Secrets and SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - run: bash tool/ci/test_checks.sh
      - run: bash tool/ci/check_false_defines.sh
      - run: bash tool/ci/check_unsafe_sql.sh .
