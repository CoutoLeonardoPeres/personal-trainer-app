name: app_personal
description: Personal Gym — gestão para personal trainers e alunos (treinos planejados, agendados, programados e concluídos).
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.40
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_slidable: ^4.0.3
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.5
  share_plus: ^12.0.1
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.15
  webview_flutter_wkwebview: ^3.24.2
  supabase_flutter: ^2.12.2
  live_activities: ^2.4.7
  app_links: ^7.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^21.0.0
  wakelock_plus: ^1.3.2
  timezone: ^0.11.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/fitness_background.png
